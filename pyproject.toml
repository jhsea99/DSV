[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dsv"
version = "1.0.0"
description = "Mitigating Object Hallucination in Vision-Language Models via Context-Detached Self-Verification (DSV)"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    # official LLaVA code (pins torch 2.1.2, transformers 4.37.2, tokenizers 0.15.1, accelerate 0.21.0)
    "llava @ git+https://github.com/haotian-liu/LLaVA.git@c121f0432da27facab705978f83c4ada465e46fd",
    "nltk==3.10.3",
    "numpy<2",
    "pillow",
    "protobuf",  # the LLaVA-1.5 (Llama) slow tokenizer needs it
]

[tool.setuptools]
packages = ["dsv"]
